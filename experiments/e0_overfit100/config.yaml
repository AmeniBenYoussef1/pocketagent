# Sanity check for E0: memorize 100 random train examples (EN/FR/AR), evaluated on the same 100.
# min_freq 1 so every target token of these examples is in the vocabulary, dropout 0, no early stop.
name: e0_overfit100
seed: 42
device: auto

data:
  data_dir: data/massive
  locales: [en-US, fr-FR, ar-SA]
  lang_tag: true
  min_freq: 1
  max_src_len: 32
  max_tgt_len: 40
  overfit_n: 100

model:
  type: lstm
  emb_dim: 256
  hidden_dim: 512
  num_layers: 2
  dropout: 0.0

train:
  epochs: 150
  batch_size: 16
  eval_batch_size: 100
  lr: 0.001
  clip: 1.0
  patience: null
