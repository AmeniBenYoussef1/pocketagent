<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PocketAgent turns spoken-style commands in English, French and Arabic into function calls." />
    <title>PocketAgent</title>
    <script>
      // apply the saved theme before the first paint, so there is no flash
      const forced = new URLSearchParams(location.search).get("theme");
      if (forced) localStorage.setItem("theme", forced);
      if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
